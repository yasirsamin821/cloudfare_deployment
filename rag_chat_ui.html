<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Personal RAG Chat</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e6e6;
    --muted: #8a8f98;
    --accent: #5b8cff;
    --user-bubble: #2a3550;
    --bot-bubble: #1f232c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .actions { display: flex; gap: 10px; align-items: center; }
  header button.small {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  header button.small:hover { color: var(--text); border-color: var(--accent); }
  #endpointBar {
    display: flex;
    gap: 8px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  #endpointBar input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  #endpointBar button {
    background: var(--accent);
    border: none;
    color: white;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 10px; line-height: 1.45; font-size: 14px; white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--user-bubble); }
  .bot { align-self: flex-start; background: var(--bot-bubble); }
  .sources, .standalone { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .standalone { font-style: italic; }
  #inputBar {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #inputBar textarea {
    flex: 1;
    resize: none;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    height: 44px;
  }
  #inputBar button {
    background: var(--accent);
    border: none;
    color: white;
    padding: 0 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  #inputBar button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { font-size: 12px; color: var(--muted); align-self: flex-start; }
</style>
</head>
<body>

<header>
  <h1>Personal RAG — ChatGPT History</h1>
  <div class="actions">
    <span class="status" id="connStatus">not connected</span>
    <button class="small" onclick="clearHistory()">Clear conversation</button>
  </div>
</header>

<div id="endpointBar">
  <input id="endpointInput" placeholder="https://your-tunnel-subdomain.trycloudflare.com" />
  <button onclick="saveEndpoint()">Connect</button>
</div>

<div id="chat"></div>

<div id="inputBar">
  <textarea id="messageInput" placeholder="Ask something from your past conversations..." onkeydown="handleKey(event)"></textarea>
  <button id="sendBtn" onclick="sendMessage()">Send</button>
</div>

<script>
  let endpoint = localStorage.getItem("ragEndpoint") || "";
  document.getElementById("endpointInput").value = endpoint;
  updateConnStatus();

  // ---------------------------------------------------------------------
  // Conversation history: this is what makes the app stateful. The server
  // holds nothing between requests -- the browser keeps the full turn
  // list in localStorage and resends it with every message.
  // ---------------------------------------------------------------------
  let history = JSON.parse(localStorage.getItem("ragHistory") || "[]");

  function saveHistoryToStorage() {
    localStorage.setItem("ragHistory", JSON.stringify(history));
  }

  function clearHistory() {
    history = [];
    saveHistoryToStorage();
    document.getElementById("chat").innerHTML = "";
  }

  // Re-render any history already stored, e.g. after a page refresh.
  function renderExistingHistory() {
    for (const turn of history) {
      appendMsg(turn.content, turn.role === "user" ? "user" : "bot");
    }
  }
  renderExistingHistory();

  function updateConnStatus() {
    document.getElementById("connStatus").textContent = endpoint ? "connected: " + endpoint : "not connected";
  }

  function saveEndpoint() {
    endpoint = document.getElementById("endpointInput").value.trim().replace(/\/$/, "");
    localStorage.setItem("ragEndpoint", endpoint);
    updateConnStatus();
  }

  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function appendMsg(text, cls) {
    const chat = document.getElementById("chat");
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.appendChild(document.createTextNode(text));
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function parseSSEFrames(rawText) {
    return rawText
      .split("\n\n")
      .filter(Boolean)
      .map(frame => {
        const lines = frame.split("\n");
        const eventLine = lines.find(l => l.startsWith("event:"));
        const dataLine = lines.find(l => l.startsWith("data:"));
        return {
          event: eventLine ? eventLine.slice(6).trim() : "message",
          data: dataLine ? dataLine.slice(5).trim() : ""
        };
      });
  }

  async function sendMessage() {
    const input = document.getElementById("messageInput");
    const text = input.value.trim();
    if (!text) return;
    if (!endpoint) {
      alert("Set your Cloudflare tunnel URL above first.");
      return;
    }

    appendMsg(text, "user");
    input.value = "";
    const sendBtn = document.getElementById("sendBtn");
    sendBtn.disabled = true;

    const botDiv = appendMsg("", "bot");
    let fullText = "";
    let sources = [];
    let standalone = "";

    try {
      const res = await fetch(endpoint + "/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history: history })
      });
      if (!res.ok || !res.body) throw new Error("HTTP " + res.status);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });

        const lastBoundary = buffer.lastIndexOf("\n\n");
        if (lastBoundary === -1) continue;

        const completeText = buffer.slice(0, lastBoundary);
        buffer = buffer.slice(lastBoundary + 2);

        for (const frame of parseSSEFrames(completeText)) {
          if (frame.event === "standalone") {
            standalone = JSON.parse(frame.data);
          } else if (frame.event === "sources") {
            sources = JSON.parse(frame.data);
          } else if (frame.event === "token") {
            fullText += JSON.parse(frame.data);
            botDiv.firstChild
              ? (botDiv.firstChild.textContent = fullText)
              : botDiv.appendChild(document.createTextNode(fullText));
            document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
          } else if (frame.event === "done") {
            if (standalone && standalone.trim() !== text.trim()) {
              const sd = document.createElement("div");
              sd.className = "standalone";
              sd.textContent = "Searched as: " + standalone;
              botDiv.appendChild(sd);
            }
            if (sources.length) {
              const src = document.createElement("div");
              src.className = "sources";
              src.textContent = "Sources: " + sources.join(", ");
              botDiv.appendChild(src);
            }
          }
        }
      }

      if (fullText) {
        // Commit this turn to history now that it's complete, then persist.
        history.push({ role: "user", content: text });
        history.push({ role: "assistant", content: fullText });
        saveHistoryToStorage();
      } else {
        botDiv.remove();
      }
    } catch (err) {
      botDiv.textContent = "Error: " + err.message;
    } finally {
      sendBtn.disabled = false;
    }
  }
</script>

</body>
</html>
