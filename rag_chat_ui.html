<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Personal RAG</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0e10;
    --surface: #16181c;
    --surface2: #1e2126;
    --border: #2a2d35;
    --border2: #3a3e48;
    --text: #e8eaf0;
    --muted: #7a7f8e;
    --accent: #4ade80;
    --accent-dim: rgba(74,222,128,0.12);
    --model-bg: #111316;
    --danger: #f87171;
  }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 1.25rem;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 10px;
    flex-wrap: wrap;
  }

  .logo {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 40vw;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .dot.online { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .dot.error { background: var(--danger); }

  #clear-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  #clear-btn:hover { border-color: var(--danger); color: var(--danger); }

  /* Messages */
  #messages {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 1.25rem 0;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .msg {
    padding: 0.6rem 1.25rem;
    display: flex;
    gap: 12px;
    max-width: 860px;
    margin: 0 auto;
    width: 100%;
  }

  .avatar {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    width: 26px;
    height: 26px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .msg.user .avatar { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
  .msg.bot .avatar { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(74,222,128,0.25); }

  .content {
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--text);
    flex: 1;
    min-width: 0;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user .content { color: #c8cad2; }

  .meta-line {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 8px;
    line-height: 1.5;
  }
  .meta-line.standalone { font-style: italic; }

  .typing {
    display: flex;
    gap: 4px;
    align-items: center;
    height: 20px;
  }
  .typing span {
    width: 5px; height: 5px;
    background: var(--muted);
    border-radius: 50%;
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100% { opacity: 0.2; } 40% { opacity: 1; } }

  .empty-state {
    max-width: 860px;
    margin: 4rem auto;
    padding: 0 1.5rem;
    text-align: center;
    color: var(--muted);
  }
  .empty-state .big { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--accent); margin-bottom: 0.5rem; }
  .empty-state p { font-size: 13px; }

  /* Input area */
  footer {
    border-top: 1px solid var(--border);
    padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom));
    flex-shrink: 0;
  }

  .input-row {
    display: flex;
    gap: 10px;
    max-width: 860px;
    margin: 0 auto;
    align-items: flex-end;
  }

  #input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 16px; /* prevents iOS auto-zoom on focus */
    padding: 10px 14px;
    border-radius: 6px;
    outline: none;
    resize: none;
    min-height: 44px;
    max-height: 160px;
    line-height: 1.5;
    transition: border-color 0.15s;
    overflow-y: auto;
  }
  #input:focus { border-color: var(--border2); }
  #input::placeholder { color: var(--muted); }

  #send-btn {
    background: var(--accent-dim);
    border: 1px solid rgba(74,222,128,0.35);
    color: var(--accent);
    width: 44px;
    height: 44px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  #send-btn:hover:not(:disabled) { background: var(--accent); color: #000; }
  #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  #send-btn svg { width: 16px; height: 16px; }
</style>
</head>
<body>

<header>
  <div class="logo">rag//chatgpt-history</div>
  <div class="status">
    <div class="dot" id="status-dot"></div>
    <span id="status-text">loading config...</span>
  </div>
  <button id="clear-btn" onclick="clearHistory()">clear chat</button>
</header>

<div id="messages">
  <div class="empty-state" id="empty-state">
    <div class="big">// ready</div>
    <p>Connecting to your backend...</p>
  </div>
</div>

<footer>
  <div class="input-row">
    <textarea id="input" placeholder="Ask something from your past conversations..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="send-btn" onclick="sendMessage()" disabled>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2L8 8M14 2L10 13.5L8 8M14 2L2.5 6L8 8"/>
      </svg>
    </button>
  </div>
</footer>

<script>
  // ---------------------------------------------------------------------
  // CONFIG_URL: raw.githubusercontent.com URL to config.json in your repo.
  // deploy.sh overwrites config.json with the latest tunnel URL on every
  // restart, so this page always finds the currently-live backend without
  // anyone editing this HTML file again.
  // ---------------------------------------------------------------------
  const CONFIG_URL = "https://raw.githubusercontent.com/yasirsamin821/cloudfare_deployment/main/config.json";

  let endpoint = "";

  function setStatus(text, cls) {
    document.getElementById('status-text').textContent = text;
    document.getElementById('status-dot').className = 'dot ' + cls;
  }

  async function loadEndpointFromConfig() {
    try {
      const res = await fetch(CONFIG_URL + "?t=" + Date.now());
      if (!res.ok) throw new Error("HTTP " + res.status);
      const cfg = await res.json();
      endpoint = cfg.apiUrl;
      setStatus(endpoint.replace(/^https?:\/\//, ''), 'online');
      document.getElementById('send-btn').disabled = false;
      if (!history.length) {
        document.getElementById('empty-state').innerHTML =
          '<div class="big">// connected</div><p>Ask something from your past conversations.</p>';
      }
    } catch (err) {
      setStatus('config load failed', 'error');
      document.getElementById('send-btn').disabled = true;
    }
  }
  loadEndpointFromConfig();
  setInterval(loadEndpointFromConfig, 60000);

  // ---------------------------------------------------------------------
  // Conversation history: this is what makes the app stateful. The server
  // holds nothing between requests -- the browser keeps the full turn
  // list in localStorage and resends it with every message.
  // ---------------------------------------------------------------------
  let history = JSON.parse(localStorage.getItem("ragHistory") || "[]");

  function saveHistoryToStorage() {
    localStorage.setItem("ragHistory", JSON.stringify(history));
  }

  function clearHistory() {
    history = [];
    saveHistoryToStorage();
    document.getElementById("messages").innerHTML =
      '<div class="empty-state" id="empty-state"><div class="big">// cleared</div><p>Conversation reset.</p></div>';
  }

  function renderExistingHistory() {
    for (const turn of history) {
      addMsg(turn.role === "user" ? "user" : "bot", turn.content);
    }
  }
  renderExistingHistory();

  function addMsg(role, content, isTyping = false) {
    document.getElementById('empty-state')?.remove();
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    const label = role === 'user' ? 'you' : 'ai';
    div.innerHTML = `
      <div class="avatar">${label}</div>
      <div class="content">${isTyping ? '<div class="typing"><span></span><span></span><span></span></div>' : escHtml(content)}</div>
    `;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div.querySelector('.content');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 160) + "px";
  }

  function parseSSEFrames(rawText) {
    return rawText
      .split("\n\n")
      .filter(Boolean)
      .map(frame => {
        const lines = frame.split("\n");
        const eventLine = lines.find(l => l.startsWith("event:"));
        const dataLine = lines.find(l => l.startsWith("data:"));
        return {
          event: eventLine ? eventLine.slice(6).trim() : "message",
          data: dataLine ? dataLine.slice(5).trim() : ""
        };
      });
  }

  let isStreaming = false;

  async function sendMessage() {
    if (isStreaming) return;
    const input = document.getElementById("input");
    const text = input.value.trim();
    if (!text) return;
    if (!endpoint) {
      alert("Backend URL hasn't loaded yet — wait a moment or check your connection.");
      return;
    }

    addMsg("user", text);
    input.value = "";
    autoResize(input);

    isStreaming = true;
    document.getElementById("send-btn").disabled = true;

    const contentEl = addMsg("bot", "", true);
    let fullText = "";
    let sources = [];
    let standalone = "";

    try {
      const res = await fetch(endpoint + "/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history: history })
      });
      if (!res.ok || !res.body) throw new Error("HTTP " + res.status);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let firstToken = true;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });

        const lastBoundary = buffer.lastIndexOf("\n\n");
        if (lastBoundary === -1) continue;

        const completeText = buffer.slice(0, lastBoundary);
        buffer = buffer.slice(lastBoundary + 2);

        for (const frame of parseSSEFrames(completeText)) {
          if (frame.event === "standalone") {
            standalone = JSON.parse(frame.data);
          } else if (frame.event === "sources") {
            sources = JSON.parse(frame.data);
          } else if (frame.event === "token") {
            if (firstToken) { contentEl.innerHTML = ""; firstToken = false; }
            fullText += JSON.parse(frame.data);
            contentEl.textContent = fullText;
            document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
          } else if (frame.event === "done") {
            if (standalone && standalone.trim() !== text.trim()) {
              const sd = document.createElement("div");
              sd.className = "meta-line standalone";
              sd.textContent = "searched as: " + standalone;
              contentEl.appendChild(sd);
            }
            if (sources.length) {
              const src = document.createElement("div");
              src.className = "meta-line";
              src.textContent = "sources: " + sources.join(", ");
              contentEl.appendChild(src);
            }
          }
        }
      }

      if (fullText) {
        history.push({ role: "user", content: text });
        history.push({ role: "assistant", content: fullText });
        saveHistoryToStorage();
      } else {
        contentEl.closest('.msg').remove();
      }
    } catch (err) {
      contentEl.innerHTML = `<span style="color:var(--danger)">Error: ${escHtml(err.message)}</span>`;
    }

    isStreaming = false;
    document.getElementById("send-btn").disabled = false;
    document.getElementById("input").focus();
  }
</script>

</body>
</html>
